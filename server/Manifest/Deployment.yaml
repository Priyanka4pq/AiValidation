apiVersion: apps/v1
kind: Deployment
metadata:
    name: ai-backend-deployment
    namespace: aiValidation
spec:
    replicas: 2
    selector:
        matchLabels:
            app: ai-backend
    template:
        metadata:
            labels:
                app: ai-backend
        spec:
            containers:
            - name: ai-backend
              image: priyanka4pq/ai:latest
              imagePullPolicy: Always
              ports:
              - containerPort: 5000
              env:
              - name: MONGO_URI
                valueFrom:
                  secretKeyRef:
                      name: ai-secret
                      key: MONGO_URI
            
              - name: GEMINI_API_KEY
                valueFrom:
                  secretKeyRef:
                      name: ai-secret
                      key: GEMINI_API_KEY
              livenessProbe:
                  httpGet:
                      path: /
                      port: 5000
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3

              readinessProbe:
                  httpGet:
                      path: /
                      port: 5000
                  initialDelaySeconds: 30
                  periodSeconds: 10
